<style>
:root{--col:min(100vw,480px);--gold:#F3DE9E}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#120F0C;-webkit-text-size-adjust:100%;overflow-y:scroll}
/* locked = cover showing; the scrollbar stays put so nothing jumps sideways when it opens */
html.locked body{height:100vh;overflow:hidden}
body{min-height:100vh;font-family:'Cormorant Garamond',serif}
img{display:block;user-select:none;-webkit-user-drag:none}
.page{width:var(--col);margin:0 auto;position:relative;overflow-x:clip;background:#1C2F45}

/* ---------- cover doors ---------- */
.cover{position:fixed;top:0;bottom:0;left:50%;width:var(--col);translate:-50% 0;z-index:100;cursor:pointer;-webkit-tap-highlight-color:transparent;
  container-type:size;perspective:1800px;overflow:hidden}
.cover .bg{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 45%,#22395A 0%,#1C2F45 55%,#121E2E 100%)}
/* contain-fit: the whole card is visible on every phone, nothing cropped */
.cover .art{position:absolute;left:50%;top:50%;width:min(100cqw,calc(100cqh * 1536 / 2752));aspect-ratio:1536/2752;translate:-50% -50%;display:flex;transform-style:preserve-3d}
.door{position:relative;width:50%;height:100%;will-change:transform;backface-visibility:hidden}
.door img{width:100%;height:100%}
.door.l img{width:calc(100% + 1px)} /* overlap the halves so no hairline seam shows */
.door.l{transform-origin:0 50%;z-index:1}.door.r{transform-origin:100% 50%}
/* measured on the cover artwork: the pill spans x 577-959, y 1841-1956 of 1536x2752; above both doors */
.tapglow{position:absolute;left:37.57%;top:66.9%;width:24.87%;height:4.18%;border-radius:999px;pointer-events:none;z-index:2;transform:translateZ(2px);
  box-shadow:0 0 0 0 rgba(255,214,120,.7);animation:tap 1.8s ease-out infinite}
@keyframes tap{0%{box-shadow:0 0 0 0 rgba(255,214,120,.75)}100%{box-shadow:0 0 0 16px rgba(255,214,120,0)}}
.sheen{position:absolute;inset:1.6% 2.6%;pointer-events:none;z-index:2;transform:translateZ(2px);background:linear-gradient(115deg,transparent 35%,rgba(255,240,200,.28) 48%,transparent 60%);
  background-size:250% 100%;animation:sheen 4.5s ease-in-out infinite;mix-blend-mode:soft-light}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}

/* ---------- shared stage ---------- */
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;container-type:size;background:#1C2F45}
.art{position:absolute;left:50%;top:50%;translate:-50% -50%;container-type:size}
.stage>.art{width:max(100cqw,calc(100cqh * var(--ar)));aspect-ratio:var(--ar)}
.ly,.ly>div{position:absolute;inset:0;will-change:transform;pointer-events:none}
.ly img.full{position:absolute;inset:0;width:100%;height:100%}
.sh-peaks img{filter:drop-shadow(0 -0.4cqh 0.6cqh rgba(0,0,0,.35))}
.sh-hills img{filter:drop-shadow(0 -0.5cqh 0.8cqh rgba(0,0,0,.38))}
#front img{filter:drop-shadow(0 0 1.2cqh rgba(0,0,0,.45))}
/* pages 2-5: the concept's own shadows are in the artwork, so no extra CSS shadows on frame/scenery */
/* invisible tap areas over artwork that already shows the button / phone numbers */
.live.hit{position:absolute;pointer-events:auto;border-radius:1cqh;-webkit-tap-highlight-color:rgba(247,227,163,.25)}
.band{position:absolute;will-change:transform,opacity}
.band img{width:100%;height:100%;filter:drop-shadow(0 .15cqh .25cqh rgba(0,0,0,.45))}

/* live (real text) elements that sit with the image bands */
.live{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--gold);
  font-weight:600;letter-spacing:.01em;text-shadow:0 .15cqh .35cqh rgba(0,0,0,.65);white-space:nowrap}
.live{font-variant-numeric:lining-nums}
.live.date{font-size:2.05cqh;line-height:1.25}
.live.date::before{content:"";position:absolute;inset:-55% -14%;z-index:-1;border-radius:50%;
  background:radial-gradient(closest-side,rgba(13,22,38,.78),rgba(13,22,38,.55) 55%,rgba(13,22,38,0))}
.live.btn{pointer-events:auto;text-decoration:none;flex-direction:row;gap:.45em;font:700 2.05cqh/1 'Cormorant Garamond',serif;color:#FBE9B6;letter-spacing:.02em;
  border-radius:999px;background:linear-gradient(180deg,#D24A35,#A52C20);box-shadow:inset 0 0 0 .22cqh #E9B44C,inset 0 0 0 .42cqh #7E1F17,0 .5cqh 1cqh rgba(0,0,0,.45)}
.live.btn svg{width:1.7cqh;height:1.7cqh;flex:none}
.live.tel{pointer-events:auto;text-decoration:none;flex-direction:row;gap:.5em;font-size:2.15cqh;line-height:1}
.live.tel span{border-bottom:.12cqh dotted rgba(243,222,158,.6);padding-bottom:.15em}
.live.tel svg{width:1.5cqh;height:1.5cqh;flex:none;opacity:.9}
.live:focus-visible{outline:2px solid #F7E3A3;outline-offset:3px}

/* page 1 (hero) */
.hero{height:320vh;height:320svh;position:relative;z-index:1}
.glow{position:absolute;left:64.8%;top:54.8%;width:62%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,214,120,.5) 0%,rgba(255,170,60,.2) 40%,rgba(255,150,40,0) 70%);mix-blend-mode:screen;animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.55;scale:.92}to{opacity:1;scale:1.08}}
.mist{position:absolute;left:-20%;right:-20%;top:57%;height:9%;background:radial-gradient(ellipse at center,rgba(255,246,230,.38),rgba(255,246,230,0) 70%);filter:blur(1.2cqh);animation:mist 14s ease-in-out infinite alternate}
@keyframes mist{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
.words{position:absolute;left:18%;right:18%;top:15.2%;text-align:center;pointer-events:none}
.nm{display:block;font-family:'Great Vibes',cursive;font-size:5.7cqh;line-height:1.12;padding:.35em .3em;margin:-.35em 0;   /* room for the tall A / S swashes, so the gold isn't cut at the top */
  filter:drop-shadow(0 .25cqh .2cqh rgba(0,0,0,.55));
  background:linear-gradient(100deg,#9C6A1E 0%,#D9A441 22%,#F7E3A3 40%,#FFF6D8 48%,#F7E3A3 56%,#D9A441 74%,#9C6A1E 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.nm .amp{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:.62em;margin-right:.12em;vertical-align:.08em}
@keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
.nm.b{margin-top:calc(-.7em - .4cqh)}   /* same gap between the names as before */
.dt{margin-top:2.3cqh;font-size:2.35cqh;font-weight:600;letter-spacing:.03em;color:#E2BF73;text-shadow:0 .2cqh .3cqh rgba(0,0,0,.5);line-height:1.45}
.dust{position:absolute;inset:0;pointer-events:none}
.dust i{position:absolute;width:.5cqh;height:.5cqh;border-radius:50%;background:#FFE7A8;box-shadow:0 0 .8cqh #FFD36B;opacity:0;animation:float var(--d) ease-in-out var(--dl) infinite}
@keyframes float{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}80%{opacity:.7}100%{opacity:0;transform:translate(var(--x),-14cqh)}}

/* pages 2-5: each page holds still for a full screen of scrolling before the next slides over it */
.pg{position:relative;height:300vh;height:300svh;margin-top:-100vh;margin-top:-100svh}
.pg .stage{box-shadow:0 -24px 40px rgba(0,0,0,.55)}
.pg:last-child{height:180vh;height:180svh}

/* music + petals */
.music{position:fixed;bottom:18px;right:calc(max(0px,(100vw - 480px) / 2) + 16px);z-index:95;width:48px;height:48px;border-radius:50%;border:0;cursor:pointer;display:none;place-items:center;
  background:radial-gradient(circle at 35% 30%,#D9533F,#A42B1F);box-shadow:0 0 0 3px #E9A23B,0 0 0 5px #F3E6CC,0 10px 18px rgba(0,0,0,.4)}
.music.show{display:grid}
.music i{display:flex;gap:3px;align-items:flex-end;height:18px}
.music i b{width:3px;background:#F7E3A3;border-radius:2px;height:5px}
.music.playing i b{animation:eq .9s ease-in-out infinite alternate}
.music.playing i b:nth-child(2){animation-delay:-.3s}.music.playing i b:nth-child(3){animation-delay:-.6s}.music.playing i b:nth-child(4){animation-delay:-.15s}
@keyframes eq{from{height:4px}to{height:18px}}
.cam{position:absolute;inset:0}
/* petals: some drift in each scene's sky behind the text; others fall screen-wide in front,
   but only down the decorated side borders, so they never cover a word */
.petals{overflow:hidden}
.petals-front{position:fixed;top:0;bottom:0;left:50%;width:var(--col);translate:-50% 0;pointer-events:none;z-index:60;overflow:hidden;container-type:size}
.petal{position:absolute;top:-2cqh;width:1.1cqh;height:1.5cqh;border-radius:0 100% 0 100%;box-shadow:0 .2cqh .3cqh rgba(0,0,0,.25);animation:fall var(--d) linear var(--dl) infinite}
@keyframes fall{0%{transform:translate(0,-5cqh) rotate(0)}25%{transform:translate(var(--sx),24cqh) rotate(110deg)}50%{transform:translate(0,52cqh) rotate(220deg)}75%{transform:translate(calc(var(--sx)*-1),80cqh) rotate(320deg)}100%{transform:translate(0,110cqh) rotate(430deg)}}

</style>

      for (let i = 0; i < 9; i++) {
        const p = document.createElement('span'); p.className = 'petal';
        p.style.cssText = `left:${12 + Math.random() * 76}%;background:${cols[i % 4]};--d:${10 + Math.random() * 9}s;--dl:${-Math.random() * 14}s;--sx:${2 + Math.random() * 4}cqh;scale:${.6 + Math.random() * .6}`;
        box.append(p);
      }
    });
    /* screen-wide petals in front, falling down the left and right borders only */
    const front = $('#petalsFront');
    for (let i = 0; i < 10; i++) {
      const p = document.createElement('span'); p.className = 'petal';
      const side = i % 2 ? 90 + Math.random() * 7 : 1 + Math.random() * 7;
      p.style.cssText = `left:${side}%;background:${cols[(i + 1) % 4]};--d:${9 + Math.random() * 8}s;--dl:${-Math.random() * 14}s;--sx:${.4 + Math.random() * .9}cqh;scale:${.7 + Math.random() * .6}`;
      front.append(p);
    }
  }
  /* music: the button only appears if music.mp3 actually loads */
  const audio = $('#bgm'), mBtn = $('#music');
  let wantMusic = false;
  const play = () => audio.play().then(() => mBtn.classList.add('playing')).catch(() => {});
  function showMusic() { if (!wantMusic || audio.error) return; mBtn.classList.add('show'); play(); }
  function startMusic() { wantMusic = true; if (audio.readyState >= 1) showMusic(); }
  audio.addEventListener('loadedmetadata', showMusic);
  audio.addEventListener('error', () => mBtn.classList.remove('show'));
  mBtn.addEventListener('click', () => {
    if (audio.paused) play();
    else { audio.pause(); mBtn.classList.remove('playing'); }
  });

  const cover = $('#cover');
  if (!window.gsap) {
    cover.addEventListener('click', () => { cover.remove(); document.documentElement.classList.remove('locked'); startMusic(); petals(); }, {once: true});
    return;
  }
  gsap.registerPlugin(ScrollTrigger);
  ScrollTrigger.config({ignoreMobileResize: true});
  const inner = id => `#${id} > div`;

  /* ---------- page 1 initial state ---------- */
  gsap.set(inner('front'), {scale: 1.45, autoAlpha: 0, transformOrigin: '50% 42%'});
  /* hills rise just behind the peaks (layered), close enough that the mountains' base stays covered */
  gsap.set(inner('peaks'), {yPercent: 14});
  gsap.set(inner('hills'), {yPercent: 16});
  gsap.set(inner('sun'), {yPercent: 16});
  gsap.set(['#n1', '#n2'], {clipPath: 'inset(0 100% 0 0)'});
  gsap.set('#dt', {autoAlpha: 0, y: 14});
  gsap.from('.cover .art', {scale: 1.08, autoAlpha: 0, duration: 1.4, ease: 'power3.out'});

  function intro() {
    gsap.timeline({defaults: {ease: 'power3.out'}, onComplete: idle})
      .to(inner('front'), {scale: 1, autoAlpha: 1, duration: 2.6, ease: 'power4.out'}, 0)
      .to(inner('peaks'), {yPercent: 0, duration: 2.2}, .45)
      .to(inner('hills'), {yPercent: 0, duration: 2.2}, .55)
      .to(inner('sun'), {yPercent: 0, duration: 2.8, ease: 'power2.out'}, .75)
      .to('#n1', {clipPath: 'inset(0 0% 0 0)', duration: 1.6, ease: 'power2.inOut'}, 1.5)
      .to('#n2', {clipPath: 'inset(0 0% 0 0)', duration: 1.5, ease: 'power2.inOut'}, 2.3)
      .to('#dt', {autoAlpha: 1, y: 0, duration: 1.1}, 3.1);
  }
  function idle() {
    [['peaks', .25], ['hills', .45], ['sun', .6]].forEach(([id, a], i) =>
      gsap.to(inner(id), {yPercent: -a, duration: 3.2 + i * .7, ease: 'sine.inOut', yoyo: true, repeat: -1}));
    gsap.to(inner('front'), {scale: 1.008, duration: 4, ease: 'sine.inOut', yoyo: true, repeat: -1});
  }
  function open() {
    cover.style.pointerEvents = 'none';
    startMusic();
    gsap.timeline({onComplete: () => { cover.remove(); document.documentElement.classList.remove('locked'); ScrollTrigger.refresh(); }})
      .to('.tapglow,.sheen', {autoAlpha: 0, duration: .25})
      .to('#doorL', {rotationY: -108, duration: 1.9, ease: 'power3.inOut'}, .1)
      .to('#doorR', {rotationY: 108, duration: 1.9, ease: 'power3.inOut'}, .1)
      .to('.cover .art', {scale: 1.12, duration: 1.9, ease: 'power2.in'}, .1)
      .to('.cover .bg', {autoAlpha: 0, duration: .5}, 1.0)   /* only once the doors are well open */
      .to(cover, {autoAlpha: 0, duration: .5}, 1.6)
      .add(intro, .5)
      .add(petals, 2.2);
  }
  cover.addEventListener('click', open, {once: true});
  cover.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cover.click(); } });

  /* tilt parallax on page 1 */
  /* the frame stays still; the scene behind it moves by the same amounts relative to the frame as the
     original sway, so the depth feel is kept but the frame never slides off the mountains' edges */
  const depth = {sky: -1.3, sun: -1.05, peaks: -.85, hills: -.55, front: 0, words: -.95};
  const setters = Object.keys(depth).map(id => ({x: gsap.quickTo(`#${id}`, 'xPercent', {duration: .9, ease: 'power3.out'}), d: depth[id]}));
  const tiltTo = nx => setters.forEach(s => s.x(-nx * s.d * 1.6));
  addEventListener('pointermove', e => tiltTo((e.clientX / innerWidth - .5) * 2));
  addEventListener('deviceorientation', e => { if (e.gamma != null) tiltTo(Math.max(-1, Math.min(1, e.gamma / 25))); });

  /* page 1 scroll: step into the arch — finishes before page 2 starts to cover it */
  gsap.timeline({scrollTrigger: {trigger: '#hero', start: 'top top', endTrigger: '#pg2', end: 'top bottom', scrub: 1.2}, defaults: {ease: 'none'}})
    .to('#front', {scale: 1.5, transformOrigin: '50% 97%', duration: 1}, 0)
    .to('#hills', {yPercent: 3, scale: 1.07, transformOrigin: '50% 100%', duration: 1}, 0)
    .to('#peaks', {yPercent: 1, scale: 1.04, transformOrigin: '50% 100%', duration: 1}, 0)
    .to('#sun', {yPercent: -8, scale: 1.08, transformOrigin: '65% 55%', duration: 1}, 0)
    .to('#words', {yPercent: -12, duration: .6}, 0)
    .to('#words', {autoAlpha: 0, duration: .3, ease: 'power1.in'}, .3)
    .to('#sky', {scale: 1.05, duration: 1}, 0);

  /* ---------- pages 2-5: entrance + scroll parallax ---------- */
  PAGES.forEach((p, i) => {
    const sec = $('#pg' + p.n), q = s => sec.querySelectorAll(s);
    const front = q('.pg-front > div')[0], scene = q('.pg-scene > div')[0], bands = [...q('.band')];
    const cam = q('.cam')[0], art = q('.art')[0];
    /* arrival: the whole composition settles in from a gentle zoom; the scenery rises and fades in */
    gsap.set(cam, {scale: 1.07, transformOrigin: '50% 55%'});
    gsap.set(scene, {yPercent: 3, autoAlpha: 0});
    /* every line and every Programme card arrives the same way: rises, un-blurs and fades in */
    gsap.set(bands, {y: 26, autoAlpha: 0, scale: .96, filter: 'blur(6px)'});
    const tl = gsap.timeline({paused: true, defaults: {ease: 'power3.out'}})
      .to(cam, {scale: 1, duration: 1.8, ease: 'power4.out'}, 0)
      .to(scene, {yPercent: 0, duration: 1.4}, .1)
      .to(scene, {autoAlpha: 1, duration: .8, ease: 'power1.out'}, .1);
    bands.forEach((b, k) => {
      const at = .7 + k * (p.cards ? .3 : .17);
      tl.to(b, {y: 0, autoAlpha: 1, scale: 1, filter: 'blur(0px)', duration: .9}, at);
    });
    /* drop the finished blur filter so text stays crisp */
    tl.eventCallback('onComplete', () => gsap.set(bands, {clearProps: 'filter'}));
    ScrollTrigger.create({trigger: sec, start: 'top 78%', onEnter: () => tl.play(), onLeaveBack: () => tl.reverse()});
    /* while the page holds: the whole arch eases toward you, and the text floats up at its own depth */
    const last = i === PAGES.length - 1;
    const st = () => ({trigger: sec, start: 'top top', end: last ? 'bottom bottom' : () => '+=' + innerHeight, scrub: 1});
    gsap.to(art, {scale: 1.06, transformOrigin: '50% 96%', ease: 'none', scrollTrigger: st()});
    /* cards stay put (they cover scenery that isn't meant to be seen); text lines drift over clean sky */
    if (!p.cards) gsap.to(sec.querySelector('.pg-text'), {yPercent: -3, ease: 'none', scrollTrigger: st()});
    /* mountains & hills sink and swell slightly behind the arch (pages whose scenery continues under the frame) */
    if (p.parallax) gsap.to(sec.querySelector('.pg-scene'), {yPercent: 2, scale: 1.03, transformOrigin: '50% 100%', ease: 'none', scrollTrigger: st()});
    /* with separate layers, the hills also slide a little more than the mountains behind them */
    if (p.split) gsap.to(sec.querySelector('.pg-hills'), {yPercent: 1.5, ease: 'none', scrollTrigger: st()});
  });
})();
</script>
</body>
</html>
